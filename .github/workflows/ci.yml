name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui

      - name: Typecheck
        run: npm run typecheck

      # Without these, tests/backend.test.mjs's real end-to-end hook tests (generated
      # script -> real subprocess -> real HTTP handler -> AgentStore) silently skip.
      # ubuntu-latest ships both runtimes; only set the var when one is actually found,
      # so a runner image change degrades to "skipped" instead of failing the build.
      - name: Resolve optional hook script runtimes for end-to-end tests
        run: |
          if command -v python3 >/dev/null; then echo "PIXEL_TEST_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"; fi
          if command -v pwsh >/dev/null; then echo "PIXEL_TEST_PWSH=$(command -v pwsh)" >> "$GITHUB_ENV"; fi

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build:webview && npm run build

      - name: Package extension (.vsix)
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ github.sha }}
          path: '*.vsix'
          retention-days: 14
